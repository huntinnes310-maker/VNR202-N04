<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" width="100%" height="100%">
  <defs>
    <linearGradient id="lacGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A3" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#D97706" stop-opacity="0.5"/>
    </linearGradient>
  </defs>
  <!-- Stylized Dong Son Lac Bird (Chim Lạc sải cánh) -->
  <g fill="url(#lacGold)" stroke="#FDE68A" stroke-width="0.75" stroke-linejoin="round">
    <!-- Long beak and head -->
    <path d="M 195 45 C 175 42, 155 40, 140 44 C 132 32, 122 22, 110 16 C 120 28, 122 40, 125 48 C 110 50, 95 48, 80 44 C 95 62, 115 72, 138 75 C 135 84, 128 94, 118 102 C 138 96, 152 86, 160 74 C 172 70, 185 62, 195 45 Z" />
    <!-- Wing primary sweep feathers -->
    <path d="M 125 48 C 100 25, 70 8, 30 2 C 55 18, 75 35, 92 56 Z" opacity="0.85"/>
    <path d="M 112 55 C 90 38, 62 25, 20 18 C 45 32, 65 48, 82 66 Z" opacity="0.7"/>
    <!-- Tail feathers -->
    <path d="M 80 44 C 55 42, 30 45, 5 52 C 28 58, 52 58, 75 56 Z" opacity="0.8"/>
    <path d="M 75 56 C 50 60, 25 68, 2 78 C 25 76, 50 72, 70 66 Z" opacity="0.6"/>
    <!-- Eye dot -->
    <circle cx="150" cy="44" r="2.2" fill="#120900" stroke="#FFF2A3" stroke-width="0.8"/>
  </g>
</svg>
