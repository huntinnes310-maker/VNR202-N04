<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" width="100%" height="100%">
  <defs>
    <linearGradient id="cloudGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A3" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#B45309" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="cloudOutline" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Traditional Stylized Vietnamese Cloud Wisp (Mây Lạc Hồng) -->
  <g fill="url(#cloudGold)" stroke="url(#cloudOutline)" stroke-width="1.2" stroke-linecap="round">
    <!-- Main swirl body -->
    <path d="M 40 110 C 25 100, 20 80, 35 65 C 50 50, 75 55, 85 70 C 95 45, 130 40, 155 58 C 175 35, 220 35, 245 60 C 265 52, 290 65, 295 85 C 302 105, 285 125, 260 125 C 230 125, 215 110, 195 110 C 175 110, 160 120, 140 120 C 115 120, 105 105, 85 105 C 70 105, 55 118, 40 110 Z" />
    
    <!-- Internal spiral curls (Vân mây cuộn tròn) -->
    <path d="M 60 78 C 52 70, 48 76, 52 82 C 58 90, 72 88, 76 80 C 80 72, 70 65, 62 70" fill="none" stroke-width="1.4" opacity="0.7"/>
    <path d="M 135 68 C 125 58, 120 66, 125 72 C 132 82, 148 78, 150 68 C 152 58, 140 50, 130 58" fill="none" stroke-width="1.4" opacity="0.7"/>
    <path d="M 225 72 C 215 62, 210 70, 215 76 C 222 86, 238 82, 240 72 C 242 62, 230 54, 220 62" fill="none" stroke-width="1.4" opacity="0.7"/>

    <!-- Trailing wisps (Đuôi mây lượn) -->
    <path d="M 280 115 C 300 118, 315 125, 320 135" fill="none" stroke-width="1.2" opacity="0.6"/>
    <path d="M 30 105 C 15 112, 5 120, 0 130" fill="none" stroke-width="1.2" opacity="0.6"/>
  </g>
</svg>
