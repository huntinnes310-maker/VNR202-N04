<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="goldRadial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF2A3" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#F59E0B" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#D97706" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#78350F" stop-opacity="0.3"/>
    </radialGradient>
    <linearGradient id="goldStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <g id="dongSonDrum" stroke="url(#goldStroke)" fill="none" stroke-width="1.2" filter="url(#goldGlow)">
    <!-- Outer Rim -->
    <circle cx="250" cy="250" r="240" stroke-width="2.5" opacity="0.85"/>
    <circle cx="250" cy="250" r="234" stroke-dasharray="3,3" opacity="0.6"/>
    <circle cx="250" cy="250" r="226" stroke-width="1.5" opacity="0.75"/>
    
    <!-- Outer Geometric Chevron Band (Răng cưa) -->
    <circle cx="250" cy="250" r="216" stroke-width="1.2" opacity="0.65"/>
    <!-- 40 Tangent Chevrons -->
    <g opacity="0.75">
      <!-- Repeated chevron pattern using rotation -->
      <path d="M 250 34 L 254 44 L 250 54 L 246 44 Z M 250 54 L 250 34" stroke-width="1" />
    </g>

    <!-- Band of Flying Lac Birds (Vành Chim Lạc bay ngược chiều kim đồng hồ) -->
    <circle cx="250" cy="250" r="195" stroke-width="1.5" opacity="0.8"/>
    <circle cx="250" cy="250" r="165" stroke-width="1.5" opacity="0.8"/>
    
    <!-- 8 Stylized Lac Birds in Ring -->
    <g id="birdsRing" stroke-width="1.4" fill="url(#goldRadial)" fill-opacity="0.25">
      <!-- Bird template rotated 8 times (45 deg) -->
      <!-- Bird 1 (0 deg) -->
      <path d="M 250 62 C 275 66, 290 74, 305 78 C 290 82, 275 80, 260 76 C 252 88, 240 92, 230 90 C 242 82, 246 72, 250 62 Z M 230 90 L 210 96 M 305 78 L 318 80" />
      <!-- Bird 2 (45 deg) -->
      <path transform="rotate(45 250 250)" d="M 250 62 C 275 66, 290 74, 305 78 C 290 82, 275 80, 260 76 C 252 88, 240 92, 230 90 C 242 82, 246 72, 250 62 Z M 230 90 L 210 96 M 305 78 L 318 80" />
      <!-- Bird 3 (90 deg) -->
      <path transform="rotate(90 250 250)" d="M 250 62 C 275 66, 290 74, 305 78 C 290 82, 275 80, 260 76 C 252 88, 240 92, 230 90 C 242 82, 246 72, 250 62 Z M 230 90 L 210 96 M 305 78 L 318 80" />
      <!-- Bird 4 (135 deg) -->
      <path transform="rotate(135 250 250)" d="M 250 62 C 275 66, 290 74, 305 78 C 290 82, 275 80, 260 76 C 252 88, 240 92, 230 90 C 242 82, 246 72, 250 62 Z M 230 90 L 210 96 M 305 78 L 318 80" />
      <!-- Bird 5 (180 deg) -->
      <path transform="rotate(180 250 250)" d="M 250 62 C 275 66, 290 74, 305 78 C 290 82, 275 80, 260 76 C 252 88, 240 92, 230 90 C 242 82, 246 72, 250 62 Z M 230 90 L 210 96 M 305 78 L 318 80" />
      <!-- Bird 6 (225 deg) -->
      <path transform="rotate(225 250 250)" d="M 250 62 C 275 66, 290 74, 305 78 C 290 82, 275 80, 260 76 C 252 88, 240 92, 230 90 C 242 82, 246 72, 250 62 Z M 230 90 L 210 96 M 305 78 L 318 80" />
      <!-- Bird 7 (270 deg) -->
      <path transform="rotate(270 250 250)" d="M 250 62 C 275 66, 290 74, 305 78 C 290 82, 275 80, 260 76 C 252 88, 240 92, 230 90 C 242 82, 246 72, 250 62 Z M 230 90 L 210 96 M 305 78 L 318 80" />
      <!-- Bird 8 (315 deg) -->
      <path transform="rotate(315 250 250)" d="M 250 62 C 275 66, 290 74, 305 78 C 290 82, 275 80, 260 76 C 252 88, 240 92, 230 90 C 242 82, 246 72, 250 62 Z M 230 90 L 210 96 M 305 78 L 318 80" />
    </g>

    <!-- Inner Geometric Spiral / S-pattern band -->
    <circle cx="250" cy="250" r="145" stroke-width="1.2" opacity="0.7"/>
    <circle cx="250" cy="250" r="132" stroke-dasharray="4,4" opacity="0.6"/>
    <circle cx="250" cy="250" r="120" stroke-width="1.2" opacity="0.7"/>

    <!-- Concentric dot ring -->
    <circle cx="250" cy="250" r="102" stroke-dasharray="2,5" stroke-width="2" opacity="0.75"/>
    <circle cx="250" cy="250" r="88" stroke-width="1.5" opacity="0.8"/>

    <!-- Central 14-Point Sun Star (Ngôi sao 14 cánh biểu tượng mặt trời Đông Sơn) -->
    <!-- Center disk -->
    <circle cx="250" cy="250" r="28" fill="url(#goldRadial)" opacity="0.7" stroke-width="1.5"/>

    <!-- 14 Sun Rays -->
    <g fill="url(#goldRadial)" stroke-width="1.2">
      <!-- 360 / 14 = 25.714 deg per ray -->
      <polygon points="250,162 245,225 255,225" />
      <polygon points="250,162 245,225 255,225" transform="rotate(25.714 250 250)" />
      <polygon points="250,162 245,225 255,225" transform="rotate(51.428 250 250)" />
      <polygon points="250,162 245,225 255,225" transform="rotate(77.142 250 250)" />
      <polygon points="250,162 245,225 255,225" transform="rotate(102.856 250 250)" />
      <polygon points="250,162 245,225 255,225" transform="rotate(128.57 250 250)" />
      <polygon points="250,162 245,225 255,225" transform="rotate(154.284 250 250)" />
      <polygon points="250,162 245,225 255,225" transform="rotate(180 250 250)" />
      <polygon points="250,162 245,225 255,225" transform="rotate(205.714 250 250)" />
      <polygon points="250,162 245,225 255,225" transform="rotate(231.428 250 250)" />
      <polygon points="250,162 245,225 255,225" transform="rotate(257.142 250 250)" />
      <polygon points="250,162 245,225 255,225" transform="rotate(282.856 250 250)" />
      <polygon points="250,162 245,225 255,225" transform="rotate(308.57 250 250)" />
      <polygon points="250,162 245,225 255,225" transform="rotate(334.284 250 250)" />
    </g>

    <!-- Peacock feather / rice ear motifs between rays -->
    <g opacity="0.65" stroke-width="0.8">
      <path d="M 250 185 L 248 215 M 250 185 L 252 215" />
      <path d="M 250 185 L 248 215 M 250 185 L 252 215" transform="rotate(25.714 250 250)" />
      <path d="M 250 185 L 248 215 M 250 185 L 252 215" transform="rotate(51.428 250 250)" />
      <path d="M 250 185 L 248 215 M 250 185 L 252 215" transform="rotate(77.142 250 250)" />
      <path d="M 250 185 L 248 215 M 250 185 L 252 215" transform="rotate(102.856 250 250)" />
      <path d="M 250 185 L 248 215 M 250 185 L 252 215" transform="rotate(128.57 250 250)" />
      <path d="M 250 185 L 248 215 M 250 185 L 252 215" transform="rotate(154.284 250 250)" />
      <path d="M 250 185 L 248 215 M 250 185 L 252 215" transform="rotate(180 250 250)" />
      <path d="M 250 185 L 248 215 M 250 185 L 252 215" transform="rotate(205.714 250 250)" />
      <path d="M 250 185 L 248 215 M 250 185 L 252 215" transform="rotate(231.428 250 250)" />
      <path d="M 250 185 L 248 215 M 250 185 L 252 215" transform="rotate(257.142 250 250)" />
      <path d="M 250 185 L 248 215 M 250 185 L 252 215" transform="rotate(282.856 250 250)" />
      <path d="M 250 185 L 248 215 M 250 185 L 252 215" transform="rotate(308.57 250 250)" />
      <path d="M 250 185 L 248 215 M 250 185 L 252 215" transform="rotate(334.284 250 250)" />
    </g>
  </g>
</svg>
